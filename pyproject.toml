[project]
name = "spec-gap"
version = "0.1.0"
description = "SPEC-GAP benchmark and probe infrastructure for adversarial delegation in multi-agent LLM systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "transformer-lens>=2.0",
    "torch>=2.1",
    "einops",
    "jaxtyping",
    "huggingface-hub",
    "scikit-learn",
    "scipy",
    "numpy",
    "pandas",
    "matplotlib",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest", "ipython", "jupyter"]
modal = [
    "modal>=1.5,<2",
    "transformers>=5.8,<6",
    "accelerate>=1.12,<2",
    "safetensors>=0.5,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
